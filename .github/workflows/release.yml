# Publishes a GitHub release (and its tag, v<versionName>) whenever apk/version.json changes on
# main — i.e. each time `tools/publish.py` output is pushed — or on demand (workflow_dispatch).
# The attached APK is the one committed in apk/ — already signed with the real key, which never
# leaves the owner's machine (CI only has the debug key, so it must not rebuild the release APK).
name: release
on:
  push:
    branches: [main]
    paths: ["apk/version.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version and check the APK
        run: |
          version=$(python3 -c "import json;print(json.load(open('apk/version.json'))['versionName'])")
          echo "TAG=v$version" >> "$GITHUB_ENV"
          sha=$(sha256sum apk/hermes-montre.apk | cut -d' ' -f1)
          expected=$(python3 -c "import json;print(json.load(open('apk/version.json'))['sha256'])")
          test "$sha" = "$expected" || { echo "SHA-256 mismatch"; exit 1; }
          cp apk/hermes-montre.apk "hermes-watch-v$version.apk"
          echo "SHA256=$sha" >> "$GITHUB_ENV"
          echo "NOTES=$(python3 -c "import json;print(json.load(open('apk/version.json'))['notes'])")" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hermes Watch ${{ env.TAG }}
          body: |
            ${{ env.NOTES }}

            **Install:** download `hermes-watch-${{ env.TAG }}.apk` below, open it on the watch
            (or `adb install -r hermes-watch-${{ env.TAG }}.apk`).
            Watches already on this signing key update themselves from the bridge.

            SHA-256: `${{ env.SHA256 }}`
          files: |
            hermes-watch-${{ env.TAG }}.apk
            apk/version.json
