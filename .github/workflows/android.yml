# Builds the watch APK and uploads it as an artifact of the run.
name: android
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Le SDK Android est déjà installé sur les machines ubuntu de GitHub ($ANDROID_HOME).
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-montre-apk
          path: app/build/outputs/apk/release/app-release.apk
